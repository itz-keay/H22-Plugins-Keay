# Builds the Astro site and publishes it with GitLab Pages on every push to
# the default branch. Works for private projects on the free plan.
image: node:22-alpine

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
